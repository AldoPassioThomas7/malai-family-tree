<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>மலையப்பன் நாடார் குடும்ப மரம்</title>

<script src="https://balkan.app/js/OrgChart.js"></script>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    font-family: "Nirmala UI", sans-serif;
}

#tree {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="tree"></div>

<script>

fetch('family.json')
    .then(response => response.json())
    .then(data => {

        new OrgChart(document.getElementById("tree"), {

            mouseScrool: OrgChart.action.zoom,

            nodeBinding: {
                field_0: "name"
            },

            nodes: data
        });

    });

</script>

</body>
</html>
